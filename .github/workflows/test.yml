name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't block PRs
    env:
      # 仓库内存在 vendor/ 时，Go 1.14+ 可能默认走 vendor 模式；vendor 不完整会导致 CI 无法下载依赖而失败
      GOFLAGS: -mod=mod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'

      - name: Download dependencies
        env:
          GOTOOLCHAIN: auto
        run: go mod download

      - name: Run tests
        env:
          GOTOOLCHAIN: auto
        run: go test -mod=mod -v ./api/... ./backtest/... ./config/... ./crypto/... ./hook/... ./kernel/... ./logger/... ./market/... ./mcp/... ./store/... ./trader/... ./manager/... ./provider/coinank/coinank_api/... ./provider/hyperliquid/... ./security/...

      - name: Generate coverage
        env:
          GOTOOLCHAIN: auto
        run: go test -mod=mod -coverprofile=coverage.out -covermode=count ./api/... ./backtest/... ./config/... ./crypto/... ./hook/... ./kernel/... ./logger/... ./market/... ./mcp/... ./store/... ./trader/... ./manager/... ./provider/coinank/coinank_api/... ./provider/hyperliquid/... ./security/...
        continue-on-error: true

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't block PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Run tests
        run: cd web && npm run test
